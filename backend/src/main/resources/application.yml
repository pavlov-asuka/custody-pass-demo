spring:
  application:
    name: custody-training
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}

app:
  mode: ${APP_MODE:mock}
  model:
    transport: ${MODEL_TRANSPORT:openai}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
