spring:
  config:
    activate:
      on-profile: mock
  datasource:
    url: ${MOCK_DB_URL:jdbc:h2:file:../.local/data/custody-training;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${MOCK_DB_USERNAME:sa}
    password: ${MOCK_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false

app:
  mode: ${APP_MODE:mock}
  knowledge:
    answer-mode: ${KNOWLEDGE_ANSWER_MODE:mock}
  review:
    mode: mock
  auth:
    bootstrap:
      user1:
        employee-no: ""
        display-name: ""
        password: ""
      user2:
        employee-no: ""
        display-name: ""
        password: ""

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
